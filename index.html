<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>chemistry</title>
<style>
:root{--bg:#0f1220;--panel:#1a1f36;--ink:#e8ebf7;--mut:#8e96b8;--acc:#5eead4;--gold:#fbbf24;--bad:#f87171;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;background-image:radial-gradient(circle at 20% 0,#1f2650 0,transparent 50%)}
.wrap{max-width:1100px;margin:0 auto;padding:12px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--panel);padding:12px 16px;border-radius:12px}
h1{font-size:18px;margin:0;color:var(--acc)}
.stat b{font-size:20px;color:var(--gold)}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 14px;background:var(--acc);color:#052e2b;font-weight:700}
button:disabled{opacity:.35;cursor:not-allowed}
section{background:var(--panel);border-radius:12px;padding:12px;margin-top:12px}
h2{font-size:13px;color:var(--mut);margin:0 0 8px;letter-spacing:.05em}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.card{width:130px;min-height:150px;border-radius:10px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;background:#252b4a;border:2px solid #3a4272;transition:.15s;position:relative;font-size:13px}
.card .t{font-weight:700;font-size:15px}
.card .s{color:var(--mut);font-size:11px}
.card .pt{color:var(--gold);font-weight:700}
.hand .card{cursor:pointer}
.hand .card:hover:not(.dis){transform:translateY(-8px);border-color:var(--acc);box-shadow:0 8px 18px #0008}
.card.dis{opacity:.4;filter:grayscale(.8)}
.card.reag{border-color:#60a5fa}.card.det{border-color:#c084fc}.card.unk{border-color:var(--gold)}
.card.mol{border-color:var(--acc);background:#16403f}
.card.ok{box-shadow:0 0 0 3px var(--gold),0 0 18px var(--gold)}
.card button{padding:4px 8px;font-size:12px;margin-top:6px}
.mk .card{cursor:pointer}.mk .card:hover:not(.dis){transform:translateY(-6px);border-color:var(--acc)}.deck{color:var(--mut);font-size:13px;display:flex;flex-direction:column;justify-content:center;padding:0 10px}
#log{font-size:13px;color:var(--mut);min-height:20px;margin-top:10px}
#pass{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:20;text-align:center}#pass button{font-size:18px;padding:12px 28px}#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9}
#modal .box{background:var(--panel);padding:20px;border-radius:12px;min-width:260px;text-align:center}
#modal button{margin:6px}
</style></head><body><div class="wrap">
<header><h1>⚗️ ルート・チェンジ</h1>
<div class="stat" id="pl"></div>
<div class="stat">ターン <b id="tn">1</b>　アクション <b id="ac">2</b></div>
<button id="end">ターン終了</button></header>
<section><h2>共通市場：オープン目標</h2><div class="row" id="open"></div></section>
<section><h2>試薬市場（サプライ）：クリックで獲得（アクション-1）</h2><div class="row mk" id="mkt"></div></section>
<section><h2>相手のラボ（公開情報）</h2><div class="row" id="opp"></div></section>
<section><h2>自分のラボ：保有分子 / 「？」スロット</h2><div class="row" id="lab"></div></section>
<section><h2>手札（クリックでプレイ）</h2><div class="row hand" id="hand"></div></section>
<section><h2>裏ゴール（非公開）</h2><div class="row" id="secret"></div></section>
<div id="log"></div></div>
<div id="pass"></div>
<div id="modal"><div class="box"><div id="mq"></div><div id="mb"></div><button style="background:#3a4272;color:#fff" onclick="closeM()">キャンセル</button></div></div>
<script>
const M={
ETHYLENE:{name:"エチレン",score:0,rank:0,group:"脂肪族"},BENZENE:{name:"ベンゼン",score:0,rank:0,group:"芳香族"},
ETHANOL:{name:"エタノール",score:3,rank:1,group:"脂肪族"},ACETALDEHYDE:{name:"アセトアルデヒド",score:3,rank:1,group:"脂肪族"},NITROBENZENE:{name:"ニトロベンゼン",score:3,rank:1,group:"芳香族"},
ACETIC_ACID:{name:"酢酸",score:5,rank:2,group:"脂肪族"},ACETONE:{name:"アセトン",score:5,rank:2,group:"脂肪族"},ANILINE:{name:"アニリン",score:5,rank:2,group:"芳香族"},PHENOL:{name:"フェノール",score:5,rank:2,group:"芳香族"},
ETHYL_ACETATE:{name:"酢酸エチル",score:8,rank:3,group:"脂肪族"},ASPIRIN:{name:"アスピリン",score:8,rank:3,group:"芳香族"},SALICYLIC_ACID:{name:"サリチル酸",score:8,rank:3,group:"芳香族"}};
const RULES=[
{reagent:"加水(H2O)",input:"エチレン",output:"エタノール"},{reagent:"酸化",input:"エタノール",output:"アセトアルデヒド"},
{reagent:"酸化",input:"アセトアルデヒド",output:"酢酸"},{reagent:"濃硫酸(エステル化)",input:"酢酸",requiredHand:"エタノール",output:"酢酸エチル"},
{reagent:"混酸(ニトロ化)",input:"ベンゼン",output:"ニトロベンゼン"},{reagent:"還元(Sn+HCl)",input:"ニトロベンゼン",output:"アニリン"},
{reagent:"アルカリ融解等",input:"ベンゼン",output:"フェノール"},{reagent:"CO2加圧",input:"フェノール",output:"サリチル酸"},{reagent:"無水酢酸",input:"サリチル酸",output:"アスピリン"}];
const DET=[{card:"銀鏡反応",allowed:["アセトアルデヒド"]},{card:"ヨードホルム反応",allowed:["アセトン","エタノール"]},{card:"塩化鉄(III)",allowed:["フェノール","サリチル酸"]}];
const $=id=>document.getElementById(id);
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const byName=n=>Object.values(M).find(m=>m.name===n);
let S;
function init(){
 const deck=[];let id=0;const add=(type,name,n)=>{for(let i=0;i<n;i++)deck.push({id:id++,type,name})};
 [...new Set(RULES.map(r=>r.reagent))].forEach(n=>add("reag",n,n==="酸化"?4:2));
 add("mat","エタノール",2);add("unk","？",5);DET.forEach(d=>add("det",d.card,2));
 const goals=shuf(Object.values(M).filter(m=>m.rank>0).map(m=>m.name));
 S={mol:"エチレン",unk:false,score:0,turn:1,ac:2,deck:shuf(deck),market:[],disc:[],hand:[],goals,open:goals.splice(0,3),secret:[],over:false,log:"ゲーム開始！ エチレンから始めよう。"};
 S.P=[0,1].map(()=>{S.hand=[];draw(5);return{mol:"エチレン",unk:false,score:0,hand:S.hand,secret:S.goals.splice(0,2)}});
 S.round=1;S.cur=0;load(0);refill();say("対戦開始！ プレイヤー1の先攻（初回ドローなし）。");render();showPass()
}
function save(){S.P[S.cur]={mol:S.mol,unk:S.unk,score:S.score,hand:S.hand,secret:S.secret}}
function load(i){S.cur=i;Object.assign(S,S.P[i])}
function showPass(){const d=$("pass");d.style.display="flex";
 d.innerHTML=`<div><h1>プレイヤー${S.cur+1} の番</h1><p style="color:var(--mut)">手札と裏ゴールが表示されます。相手は画面を見ないでください。</p><button>準備OK・開始</button></div>`;
 d.querySelector("button").onclick=()=>d.style.display="none"}
function pull(){if(!S.deck.length){S.deck=shuf(S.disc);S.disc=[]}return S.deck.pop()}
function draw(n){while(n--){const c=pull();if(c)S.hand.push(c)}}
function refill(){while(S.market.length<3){const c=pull();if(!c)break;S.market.push(c)}}
function take(i){
 if(S.over||S.ac<1)return;
 const c=i<0?pull():S.market.splice(i,1)[0];if(!c)return;
 S.hand.push(c);spend();refill();say(i<0?"山札のトップから1枚獲得。":`市場から「${c.name}」を獲得。市場を補充。`);render()}
function drop(c){S.hand=S.hand.filter(x=>x.id!==c.id);S.disc.push(c)}
function say(t){S.log=t}
function spend(){S.ac--}
function play(c){
 if(S.over||S.ac<1)return;
 if(c.type==="unk"){if(S.unk)return say("「？」は既に場にあります。");drop(c);S.unk=true;spend();say("「？」を設置。検出薬で確定できます。")}
 else if(c.type==="mat"){
  if(S.mol===c.name)return say("既にその分子が場にあります。");
  drop(c);S.mol=c.name;spend();say(`「${c.name}」を場に出した。`)}
 else if(c.type==="reag"){
  const r=RULES.find(r=>r.reagent===c.name&&r.input===S.mol&&(!r.requiredHand||S.hand.some(h=>h.id!==c.id&&h.name===r.requiredHand)));
  if(!r)return say("今の分子には使えません。");
  if(r.requiredHand){drop(S.hand.find(h=>h.id!==c.id&&h.name===r.requiredHand))}
  drop(c);S.mol=r.output;spend();say(`${r.input} → ${r.output}`)}
 else if(c.type==="det"){
  if(!S.unk)return say("場に「？」が必要です。");
  if(S.hand.length<2)return say("コストとして捨てる手札が足りません。");
  const d=DET.find(d=>d.card===c.name);
  $("mq").textContent=`${c.name}：確定する分子を選択（他の手札1枚を消費）`;
  $("mb").innerHTML="";d.allowed.forEach(n=>{const b=document.createElement("button");b.textContent=n;b.onclick=()=>pickCost(c,n);$("mb").appendChild(b)});
  $("modal").style.display="flex";return}
 render();
}
function pickCost(c,out){
 $("mq").textContent=`「${out}」に確定。コストで捨てる手札を選択`;$("mb").innerHTML="";
 S.hand.filter(h=>h.id!==c.id).forEach(h=>{const b=document.createElement("button");b.textContent=h.name;b.onclick=()=>{drop(h);drop(c);S.mol=out;S.unk=false;spend();say(`？ → ${out} に進化！`);closeM();render()};$("mb").appendChild(b)});
}
function closeM(){$("modal").style.display="none"}
function claim(kind,i){
 const list=kind==="o"?S.open:S.secret,n=list[i],m=byName(n);if(n!==S.mol)return;
 const bonus=kind==="o"?2:3;S.score+=m.score+bonus;say(`${n} 達成！ +${m.score}+ボーナス${bonus}`);
 if(S.goals.length)list[i]=S.goals.pop();else list.splice(i,1);
 if(S.score>=20){S.over=true;say(`🎉 勝利！ プレイヤー${S.cur+1} の勝利！（${S.round}ラウンド）`)}
 render();
}
$("end").onclick=()=>{if(S.over)return init();
 while(S.hand.length>8)S.disc.push(S.hand.shift());
 save();const n=1-S.cur;load(n);if(n===0)S.round++;S.ac=2;draw(1);
 say(`プレイヤー${n+1}の番。1枚ドロー。`);render();showPass()};
function playable(c){
 if(S.ac<1||S.over)return false;
 if(c.type==="mat")return S.mol!==c.name;
 if(c.type==="unk")return !S.unk;
 if(c.type==="det")return S.unk&&S.hand.length>1;
 return !!RULES.find(r=>r.reagent===c.name&&r.input===S.mol&&(!r.requiredHand||S.hand.some(h=>h.id!==c.id&&h.name===r.requiredHand)));
}
function goalCard(n,kind,i,secret){
 const m=byName(n),ok=n===S.mol&&!S.over,d=document.createElement("div");
 d.className="card"+(ok?" ok":"");
 d.innerHTML=`<div><div class="s">${"★".repeat(m.rank)} ${secret?"裏ゴール +3":"+2"}</div><div class="t">${n}</div><div class="s">${m.group}</div></div><div><span class="pt">${m.score}点</span><br><button ${ok?"":"disabled"}>達成宣言</button></div>`;
 d.querySelector("button").onclick=()=>claim(kind,i);return d;
}
function render(){
 const op=S.P[1-S.cur];
 $("pl").innerHTML=`<b>P${S.cur+1}</b> の番　自分 <b>${S.score}</b> / 20　相手 <b>${op.score}</b>`;$("tn").textContent=S.round;
 $("opp").innerHTML=`<div class="card"><div><div class="s">P${2-S.cur}の分子</div><div class="t">${op.mol}</div></div><div class="s">「？」: ${op.unk?"あり":"なし"}<br>手札 ${op.hand.length}枚<br>得点 ${op.score}</div></div>`;
 $("ac").textContent=S.ac;
 $("end").textContent=S.over?"もう一度遊ぶ":"ターン終了";$("log").textContent=S.log;
 const o=$("open");o.innerHTML="";S.open.forEach((n,i)=>o.appendChild(goalCard(n,"o",i,false)));
 const dk=document.createElement("div");dk.className="deck";dk.innerHTML=`試薬山札 ${S.deck.length}枚<br>目標山札 ${S.goals.length}枚`;o.appendChild(dk);
 const mk=$("mkt");mk.innerHTML="";
 S.market.forEach((c,i)=>{const d=document.createElement("div");
  d.className=`card ${c.type==="mat"?"reag":c.type} ${S.ac<1||S.over?"dis":""}`;
  d.innerHTML=`<div class="s">${LAB[c.type]}（公開）</div><div class="t">${c.name}</div><div class="s">${hint(c)}</div>`;
  d.onclick=()=>take(i);mk.appendChild(d)});
 const td=document.createElement("div");td.className=`card ${S.ac<1||S.over?"dis":""}`;td.style.cursor="pointer";
 td.innerHTML=`<div class="s">山札（裏向き）</div><div class="t">トップから引く</div><div class="s">残り ${S.deck.length}枚 / 捨て札 ${S.disc.length}枚</div>`;
 td.onclick=()=>take(-1);mk.appendChild(td);
 const l=$("lab");l.innerHTML="";const mol=byName(S.mol);
 l.innerHTML=`<div class="card mol"><div><div class="s">現在の分子</div><div class="t">${S.mol}</div><div class="s">${mol.group}</div></div><span class="pt">${mol.score}点</span></div>
 <div class="card unk ${S.unk?"":"dis"}"><div><div class="s">未知スロット</div><div class="t">${S.unk?"？":"（空）"}</div></div><div><div class="s">${S.unk?"検出薬で確定":""}</div><button id="dq" ${S.unk&&S.ac>0&&!S.over?"":"disabled"}>？を破棄(-1)</button></div></div>`;
 l.querySelector(".mol").innerHTML+=`<button id="dm" ${S.ac>0&&!S.over?"":"disabled"}>分子を破棄(-1)</button>`;
 $("dq").onclick=()=>{S.unk=false;spend();say("「？」を破棄した。");render()};
 $("dm").onclick=()=>{$("mq").textContent="分子を破棄して、出発物質からやり直す（アクション-1）";$("mb").innerHTML="";
  ["エチレン","ベンゼン"].forEach(n=>{const b=document.createElement("button");b.textContent=n+"から";b.onclick=()=>{S.mol=n;spend();say(`分子を破棄。${n}からやり直し。`);closeM();render()};$("mb").appendChild(b)});
  $("modal").style.display="flex"};
 const h=$("hand");h.innerHTML="";
 S.hand.forEach(c=>{const d=document.createElement("div"),p=playable(c);
  const lab=LAB[c.type];
  d.className=`card ${c.type==="mat"?"reag":c.type} ${p?"":"dis"}`;
  d.innerHTML=`<div class="s">${lab}</div><div class="t">${c.name}</div><div class="s">${hint(c)}</div>`;
  d.onclick=()=>play(c);h.appendChild(d)});
 const s=$("secret");s.innerHTML="";S.secret.forEach((n,i)=>s.appendChild(goalCard(n,"s",i,true)));
}
const LAB={reag:"試薬",det:"検出薬",unk:"未知",mat:"素材"};
function hint(c){
 if(c.type==="reag")return RULES.filter(r=>r.reagent===c.name).map(r=>r.input+"→"+r.output).join("<br>");
 if(c.type==="det")return "→ "+DET.find(d=>d.card===c.name).allowed.join("/");
 if(c.type==="mat")return "場に出す／エステル化の材料";return "未知分子を設置";
}
init();
</script></body></html>
